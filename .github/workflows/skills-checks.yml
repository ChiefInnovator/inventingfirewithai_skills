name: Skills and site checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: skills-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-visibility:
    name: Package and visibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: Check packages, docs, and site discovery
        run: python -m unittest discover -s tests
